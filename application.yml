eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    hostname: localhost

management:
    tracing:
        sampling:
            probability: 1.0
        export:
            zipkin:
                endpoint: http://localhost:9411/api/v2/spans
